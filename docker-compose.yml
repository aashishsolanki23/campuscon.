version: '3.8'

services:
  app:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campuscon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=campuscon
      - SPRING_DATASOURCE_PASSWORD=JumpyFrogs&SingingBirds23
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=ap-south-1
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - FIREBASE_CREDENTIALS_FILE=/firebase-credentials.json
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./firebase-credentials.json:/firebase-credentials.json
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=campuscon
      - MYSQL_ROOT_PASSWORD=JumpyFrogs&SingingBirds23
      - MYSQL_USER=campuscon
      - MYSQL_PASSWORD=JumpyFrogs&SingingBirds23
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  mysql-data:
  redis-data:
