spring:
  profiles:
    active: dev
    include: secrets
    
  datasource:
    url: jdbc:mysql://localhost:3306/campuscon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  redis:
    host: localhost
    port: 6379

jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

logging:
  level:
    org.springframework.security: DEBUG
    com.campuscon: DEBUG

aws:
  access-key: ${aws.access-key}
  secret-key: ${aws.secret-key}
  region: ${aws.region}
  s3:
    bucket: ${aws.s3.bucket}

firebase:
  credentials-file: ${firebase.credentials-file}

# OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false
  default-produces-media-type: application/json
