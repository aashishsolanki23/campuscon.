spring:
  profiles:
    active: local
    include: secrets
    
  datasource:
    url: jdbc:mysql://localhost:3306/campuscon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  redis:
    host: localhost
    port: 6379
    timeout: 2000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1
        
  # Task scheduling configuration
  task:
    scheduling:
      pool:
        size: 5
        
  # OAuth2 Client Settings
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth2.google.client-id:your-google-client-id}
            client-secret: ${oauth2.google.client-secret:your-google-client-secret}
            scope: email,profile
          facebook:
            client-id: ${oauth2.facebook.client-id:your-facebook-client-id}
            client-secret: ${oauth2.facebook.client-secret:your-facebook-client-secret}
            scope: email,public_profile

jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

logging:
  level:
    org.springframework.security: DEBUG
    com.campuscon: DEBUG

aws:
  access-key: ${aws.access-key}
  secret-key: ${aws.secret-key}
  region: ${aws.region}
  s3:
    bucket: ${aws.s3.bucket}

firebase:
  credentials-file: ${firebase.credentials-file}

# Google Sheet Integration
google:
  sheet:
    colleges:
      url: https://docs.google.com/spreadsheets/d/e/YOUR_SHEET_ID/pub?output=csv

# OTP Configuration
otp:
  expiry:
    minutes: 10
  length: 6
  max:
    attempts:
      per:
        hour: 5

# Embedding API Configuration
embedding:
  api:
    url: ${OPENAI_API_URL:https://api.openai.com/v1/embeddings}
    key: ${OPENAI_API_KEY:}
  model: text-embedding-ada-002
  dimension: 1536

# Schedule settings for synchronization and OAuth2 Client Settings

# CORS Settings
cors:
  allowed-origins: http://localhost:3000,https://campuscon.com
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: '*'
  allow-credentials: true

# OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false
  default-produces-media-type: application/json
