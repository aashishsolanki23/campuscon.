spring.application.name=backend
# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/campuscon
spring.datasource.username=campuscon
spring.datasource.password=JumpyFrogs&SingingBirds23
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Google Sheet Integration
google.sheet.colleges.url=https://docs.google.com/spreadsheets/d/e/YOUR_SHEET_ID/pub?output=csv
# Schedule settings for synchronization
spring.task.scheduling.pool.size=5

# Redis Configuration (for OTP storage)
spring.redis.host=localhost
spring.redis.port=6379

# API Response Settings
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Settings
jwt.secret=secureJwtSecretKeyForCampusConApp1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=86400000

# OAuth2 Client Settings
# These are placeholder values - replace with actual credentials in production
spring.security.oauth2.client.registration.google.client-id=your-google-client-id
spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.facebook.client-id=your-facebook-client-id
spring.security.oauth2.client.registration.facebook.client-secret=your-facebook-client-secret
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# CORS Settings
cors.allowed-origins=http://localhost:3000,https://campuscon.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true