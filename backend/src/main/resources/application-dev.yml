spring:
  # Use H2 in-memory database for development
  datasource:
    url: jdbc:h2:mem:campuscondb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Disable Redis for development
  data:
    redis:
      host: localhost
      port: 6379
      enabled: false

  # Mail configuration (set to dummy values for dev)
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# JWT configuration
jwt:
  secret: campuscon-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-security
  expiration: 86400000 # 24 hours

# Logging configuration
logging:
  level:
    root: INFO
    com.campuscon: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.messaging: DEBUG
