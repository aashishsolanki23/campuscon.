apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscon-backend
  namespace: campuscon
  labels:
    app: campuscon-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campuscon-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: campuscon-backend
    spec:
      containers:
      - name: campuscon-backend
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/campuscon-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        envFrom:
        - configMapRef:
            name: campuscon-config
        - secretRef:
            name: campuscon-secrets
        volumeMounts:
        - name: firebase-credentials
          mountPath: /firebase-credentials.json
          subPath: firebase-credentials.json
          readOnly: true
      volumes:
      - name: firebase-credentials
        secret:
          secretName: firebase-credentials
